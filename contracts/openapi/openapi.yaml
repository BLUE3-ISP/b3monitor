openapi: 3.1.0
info:
  title: b3monitor — API da central
  version: 0.1.0
  summary: Contrato HTTP entre a central, as sondas e os clientes (módulo mobile, painel).
  description: |
    **Planejamento parcial.** Só `GET /health` existe hoje. A ingestão (`POST /probe/results`) nasce no
    item B3 da fila, e `POST /probe/heartbeat` e `GET /probe/config` depois dela; estão aqui porque
    o contrato é publicado ANTES de codificar os dois lados (06 §6).

    Os corpos são os JSON Schemas de `contracts/schemas/`, por `$ref` externo: há um contrato só.
    Os módulos de cliente (o módulo mobile, em outro repositório) consomem este arquivo (ADR-012).

    Limites do TRANSPORTE, que não cabem em schema e o servidor impõe: 4 MiB por requisição,
    expansão de até 16 MiB para `Content-Encoding: gzip`, e de 1 a 500 itens por lote (C-19).
servers:
  - url: /api/v1
    description: A API é sempre versionada; nada vive fora deste prefixo.
security:
  - sondaBearer: []
tags:
  - name: ops
  - name: sonda
paths:
  /health:
    get:
      tags: [ops]
      operationId: health
      summary: A central responde e alcança o banco?
      description: |
        **Não é o canário** (F0-07). Um 200 prova só que o processo web responde e o PostgreSQL atende;
        não prova que os workers andam nem que o motor decide.
      security: []
      responses:
        "200":
          description: Processo de pé e banco atendendo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: O banco não responde. O corpo diz `status` igual a `unavailable`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /probe/results:
    post:
      tags: [sonda]
      operationId: ingerirResultados
      summary: Ingestão durável de resultados (pelo menos uma vez)
      description: |
        `accepted` só é devolvido DEPOIS do commit durável. Se a conexão cair depois do commit, o
        reenvio do mesmo `result_id` recebe `duplicate` e **não cria segundo trabalho nem novo
        incidente**. O cliente não assume aceitação de item sem esta confirmação.

        Falhas de transporte (400, 401, 403, 413, 429, 5xx) vêm antes de qualquer item ser
        processado e não usam o corpo de resposta por item. `Retry-After` orienta a retentativa.
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          description: "`gzip` é aceito, com limite de expansão de 16 MiB (C-19)."
          schema: { enum: [gzip] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/ingest-batch.schema.json" }
      responses:
        "200":
          description: O lote foi processado; cada item tem o seu status.
          content:
            application/json:
              schema: { $ref: "../schemas/ingest-response.schema.json" }
        "400": { description: Lote malformado, ou violando o schema. Nenhum item foi processado. }
        "401": { description: Credencial de sonda ausente ou inválida. }
        "403": { description: A credencial não corresponde a probe_id, assignment ou geração do lote. }
        "413": { description: Corpo acima de 4 MiB, ou expansão acima de 16 MiB. }
        "429":
          description: Limite de taxa. Respeite `Retry-After`; não sobrecarregue uma central recém-recuperada.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
        "503":
          description: Central indisponível. O spool da sonda guarda e reenvia.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
  /probe/heartbeat:
    post:
      tags: [sonda]
      operationId: heartbeatSonda
      summary: Autodiagnóstico da sonda (não é resultado de alvo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/heartbeat.schema.json" }
      responses:
        "204": { description: Registrado. }
        "400": { description: Corpo violando o schema. }
        "401": { description: Credencial de sonda ausente ou inválida. }
  /probe/config:
    get:
      tags: [sonda]
      operationId: configuracaoSonda
      summary: Apenas a configuração desta sonda
      description: A sonda só recebe o seu próprio bundle. Ele nunca traz política local de redes (INV-09).
      responses:
        "200":
          description: O bundle vigente.
          content:
            application/json:
              schema: { $ref: "../schemas/bundle.schema.json" }
        "401": { description: Credencial de sonda ausente ou inválida. }
components:
  securitySchemes:
    sondaBearer:
      type: http
      scheme: bearer
      description: Credencial permanente vinculada àquela sonda e aos endpoints de que ela precisa (04 §2). Nunca acessa APIs humanas.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, as_of, checks]
      properties:
        status: { enum: [ok, unavailable] }
        service: { const: b3mon-central }
        as_of: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database: { enum: [ok, fail] }
